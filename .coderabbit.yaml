# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "pt-BR"
tone_instructions: "Seja objetivo e técnico. Este repositório só tem telas (EJS, Tailwind CSS e JavaScript do navegador). Foque em segurança no navegador, acessibilidade e nas regras do AGENTS.md. Não peça testes automatizados."
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  # Resumo no comentário do CodeRabbit, sem editar a descrição do PR
  high_level_summary_in_walkthrough: true
  # Sem o aviso "Review skipped" nos PRs
  review_status: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
  # Arquivos gerados ou grandes demais para revisar
  path_filters:
    - "!public/css/style.css"
    - "!package-lock.json"
    - "!docs/design/**"
    - "!docs/figma-export/**"
  tools:
    # O projeto usa Prettier e ESLint; o Biome sugeriria outro estilo
    biome:
      enabled: false
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
chat:
  auto_reply: true
