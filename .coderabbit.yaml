# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "pt-BR"
tone_instructions: "Seja objetivo e técnico. Foque em segurança, tratamento de erros e no contrato da issue (códigos HTTP, message/error, JSON em camelCase). Não peça testes automatizados."
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
chat:
  auto_reply: true
